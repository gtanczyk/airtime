name: Verify Airtime
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: ['Airtime release PR', 'Sync sources from Gamedev.pl']
    types: [completed]
permissions:
  contents: read
  pull-requests: read
jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'master' || github.ref }}
      - name: Select generated PR branch
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          branch=sync/gamedev
          if [ "$UPSTREAM_WORKFLOW" = 'Airtime release PR' ]; then branch=release/airtime; fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=master" --jq ".[] | select(.head.ref == \"$branch\") | .head.sha")"
          if [ -n "$sha" ]; then
            git fetch origin "$sha"
            git checkout --detach FETCH_HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources
        run: node scripts/deploy.mjs --dry-run
      - name: Test gameplay regressions
        run: npm test
      - name: Install local launcher
        run: npm ci
      - name: Test runtime bootstrap
        run: node --test scripts/public-runtime.test.mjs
      - name: Prepare public local environment
        run: npm run setup
      - name: Typecheck and static game checks
        run: npm run verify
      - name: Smoke test npm run dev
        run: npm run dev -- --smoke
