name: Verify Airtime
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_run:
    workflows: ['Airtime release PR', 'Sync sources from Gamedev.pl']
    types: [completed]
permissions:
  contents: read
  pull-requests: read
jobs:
  verify:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'master' || github.ref }}
      - name: Select generated PR branch
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          branch=sync/gamedev
          if [ "$UPSTREAM_WORKFLOW" = 'Airtime release PR' ]; then branch=release/airtime; fi
          sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=master" --jq ".[] | select(.head.ref == \"$branch\") | .head.sha")"
          if [ -n "$sha" ]; then
            git fetch origin "$sha"
            git checkout --detach FETCH_HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources
        run: node scripts/deploy.mjs --dry-run
      - name: Test flight and camera
        run: npm test
      - name: Download official verification workspace
        env:
          GAMEDEV_CREATOR_KEY: ${{ secrets.GAMEDEV_CREATOR_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const token=process.env.GAMEDEV_CREATOR_KEY?.match(/gdpl_pat_[a-f0-9]{16}_[A-Za-z0-9_-]{43}/)?.[0];
          if(!token) throw new Error('Missing Gamedev.pl PAT');
          console.log('::add-mask::'+token);
          const response=await fetch('https://www.gamedev.pl/api/me/studio/games/airtime/workspace',{
            headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(120000)
          });
          if(!response.ok)throw new Error('Workspace HTTP '+response.status);
          await writeFile(process.env.RUNNER_TEMP+'/airtime-workspace.tgz',Buffer.from(await response.arrayBuffer()));
          JS
      - name: Install local launcher
        run: npm ci
      - name: Prepare official local environment
        env:
          GAMEDEV_WORKSPACE_ARCHIVE: ${{ runner.temp }}/airtime-workspace.tgz
        run: npm run setup
      - name: Typecheck and static game checks
        run: npm run verify
      - name: Smoke test npm run dev
        run: npm run dev -- --smoke
