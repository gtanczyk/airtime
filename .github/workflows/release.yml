name: Airtime release
on:
  push:
    branches: [master]
    paths: ['.github/VERSION']
    tags: ['airtime-v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: airtime-gamedev-preview
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve release and check notes
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/* ]] && ! git show HEAD^:.github/VERSION >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Baseline VERSION added; no release requested."
            exit 0
          fi
          version="$(tr -d '\n' < .github/VERSION)"
          node scripts/release.mjs notes "$version" > /tmp/airtime-notes.md
          tag="airtime-v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag does not match VERSION"; exit 1
          fi
          if git rev-parse "$tag" >/dev/null 2>&1 && [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
            echo "::error::Existing release tag points at another commit"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy release preview to Studio
        if: steps.version.outputs.skip != 'true'
        env:
          GAMEDEV_CREATOR_KEY: ${{ secrets.GAMEDEV_CREATOR_KEY }}
          GITHUB_REF_NAME: airtime-v${{ steps.version.outputs.version }}
        run: |
          node scripts/deploy.mjs --dry-run
          node scripts/deploy.mjs
      - name: Tag and publish release notes
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="airtime-v$VERSION"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          gh release create "$tag" --verify-tag --title "Airtime v$VERSION" --notes-file /tmp/airtime-notes.md
